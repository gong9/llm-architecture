    <title>RAG 核心原理解析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Ali-Cloud inspired palette
              primary: '#1677ff', // Ali Blue
              'primary-bg': '#e6f4ff',
              secondary: '#fa8c16', // Ali Orange
              success: '#52c41a',
              text: {
                main: '#1f2329',
                secondary: '#8c8c8c',
                tertiary: '#bfbfbf'
              },
              bg: {
                page: '#f0f2f5',
                card: '#ffffff'
              },
              surface: '#ffffff',
            },
            fontFamily: {
              hand: ['"Architects Daughter"', 'cursive'],
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            },
            boxShadow: {
              'ali': '0 2px 8px rgba(0, 0, 0, 0.08)',
              'ali-hover': '0 4px 16px rgba(0, 0, 0, 0.12)',
            },
            animation: {
              'dash': 'dash 1.5s linear infinite',
            },
            keyframes: {
              dash: {
                to: {
                  strokeDashoffset: '-20',
                },
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@300;400;500;600&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f2f5;
        color: #1f2329;
        overflow-x: hidden;
      }

      /* Hand-drawn border effect class */
      .sketchy-box {
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        border: 2px solid #1f2329;
      }
      
      .sketchy-box-sm {
         border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #bfbfbf; 
        border-radius: 3px;
      }
    </style>
